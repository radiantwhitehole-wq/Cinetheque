<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.5 'DM Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}

.pc{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:grid;gap:8px;align-content:start}

.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:var(--r);padding:48px 20px;text-align:center;color:var(--mu)}

.acts{display:flex;justify-content:center}

async function tm(path,params={}){

let sT;
function searchPage(a){
  a.innerHTML=`<div class="ph"><h1>Recherche</h1><p>Trouvez un film ou une série, ouvrez sa fiche, puis ajoutez-le à votre bibliothèque.</p></div>
  <div class="tools s"><input id="sq" type="search" placeholder="Titre d’un film ou d’une série" aria-label="Titre" autocomplete="off"><select id="sty" aria-label="Type"><option value="">Films et séries</option><option value="film">Films</option><option value="serie">Séries</option></select></div>
  <div class="pgrid" id="res"><div class="empty">Tapez un titre pour lancer la recherche.</div></div>`;
  const run=()=>{clearTimeout(sT);sT=setTimeout(runSearch,350)};
  $('#sq').oninput=run;$('#sty').onchange=runSearch;$('#sq').focus();
}
async function runSearch(){
  const q=$('#sq').value.trim(),ty=$('#sty').value,n=runSearch.n=(runSearch.n||0)+1,box=$('#res');
  if(q.length<2){box.innerHTML='<div class="empty">Tapez un titre pour lancer la recherche.</div>';return}
  try{
    const calls=[];
    if(ty!=='serie')calls.push(tm('/search/movie',{query:q}).then(r=>r.results.map(x=>({...x,_t:'film'}))));
    if(ty!=='film')calls.push(tm('/search/tv',{query:q}).then(r=>r.results.map(x=>({...x,_t:'serie'}))));
    const res=(await Promise.all(calls)).flat().sort((a,b)=>b.popularity-a.popularity).slice(0,18);
    if(n!==runSearch.n||!$('#res'))return;
    box.innerHTML=res.length?res.map(r=>{const title=r.title||r.name,y=(r.release_date||r.first_air_date||'').slice(0,4),inl=db.some(i=>i.tmdb_id===r.id&&i.type===r._t);
      return `<button class="pc" data-id="${r.id}" data-t="${r._t}">${poster({title},r.poster_path?'https://image.tmdb.org/t/p/w342'+r.poster_path:'')}<b>${esc(title)}</b><span class="meta">${y||'?'} · ${r._t==='film'?'Film':'Série'}${inl?' · ✓ ajouté':''}</span></button>`}).join('')
      :'<div class="empty">Aucun résultat.</div>';
    box.querySelectorAll('.pc').forEach(b=>b.onclick=async()=>{try{const o=await details(b.dataset.id,b.dataset.t);fiche(o,db.find(i=>i.tmdb_id===o.tmdb_id&&i.type===o.type))}catch(e){toast(String(e))}});
  }catch(e){toast(typeof e==='string'?e:'Recherche impossible. Vérifiez votre connexion.')}
}

  if(GEN)return GEN;
  const[m,v]=await Promise.all([tm('/genre/movie/list'),tm('/genre/tv/list')]),map={};
  m.genres.forEach(g=>(map[g.name]=map[g.name]||{name:g.name}).film=g.id);
  v.genres.forEach(g=>(map[g.name]=map[g.name]||{name:g.name}).serie=g.id);
  return GEN=Object.values(map).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
}
const gid=(g,t)=>g[t]??ALIAS[t][g[t==='film'?'serie':'film']];
const pick=l=>l[Math.floor(Math.random()*l.length)];
function spin(el,names,final,done){
  el.classList.remove('hit');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches||prefs.anim===false||names.length<2){el.textContent=final;el.classList.add('hit');return done()}
  let i=0,d=60;const end=Date.now()+2200;
  const tick=()=>{if(Date.now()>end){el.textContent=final;el.classList.add('hit');return done()}el.textContent=names[i++%names.length];d*=1.09;setTimeout(tick,d)};
  tick();
}
function result(o,lib){
  $('#rsub').textContent=lib?'Dans votre liste':'À découvrir';
  $('#rres').innerHTML=`<div class="res">${poster(o)}<div class="body"><h3>${esc(o.title)}</h3><div class="meta">${metaLine(o)}</div><div class="gs">${o.genres.slice(0,3).map(g=>`<span class="g">${esc(g)}</span>`).join('')}</div><p class="desc">${esc(o.description)}</p><div><button class="btn" id="ro">${lib?'Ouvrir la fiche':'Voir la fiche et ajouter'}</button></div></div></div>`;
  $('#ro').onclick=()=>fiche(o,lib);
}
async function roulette(a){
  a.innerHTML=`<div class="ph"><h1>Roulette</h1><p>Laissez le hasard choisir votre prochaine soirée.</p></div>
  <div class="tools t4"><select id="rw" aria-label="Liste"><option value="nous">Liste Nous</option><option value="lu">Liste Lu</option><option value="gab">Liste Gab</option></select><select id="rty" aria-label="Type"><option value="">Films et séries</option><option value="film">Films</option><option value="serie">Séries</option></select><select id="rg" aria-label="Genre"><option value="">Tous les genres</option></select><button class="btn ghost" id="rgg">Genre au hasard</button></div>
  <div class="stage"><div class="reel" id="reel">?</div><div class="meta" id="rsub">Choisissez un tirage ci-dessous</div><div id="rres" style="width:100%;display:grid;justify-items:center"></div></div>
  <div class="tools t2"><button class="btn" id="r1">Tirer dans notre liste « à voir »</button><button class="btn" id="r3">Découvrir un nouveau titre</button></div>`;
  const fill=()=>{if(GEN){$('#rg').innerHTML+=GEN.map(g=>`<option>${esc(g.name)}</option>`).join('');$('#rg').value=rl.g}};
  $('#rw').value=rl.w;$('#rw').onchange=e=>rl.w=e.target.value;$('#rty').value=rl.t;$('#rty').onchange=e=>rl.t=e.target.value;$('#rg').onchange=e=>rl.g=e.target.value;
  genres().then(fill).catch(e=>toast(String(e)));
  const run=async fn=>{const bs=document.querySelectorAll('.stage ~ .tools .btn,#rgg');bs.forEach(b=>b.disabled=true);$('#rres').innerHTML='';
    try{await fn()}catch(e){toast(typeof e==='string'?e:'Tirage impossible, réessayez.')}bs.forEach(b=>b.disabled=false)};
  const types=()=>rl.t?[rl.t]:['film','serie'],sp=(n,f)=>new Promise(r=>spin($('#reel'),n,f,r));
  $('#rgg').onclick=()=>run(async()=>{const l=await genres(),g=pick(l);await sp(l.map(x=>x.name),g.name);rl.g=g.name;$('#rg').value=g.name;$('#rsub').textContent='Genre tiré au sort'});
  $('#r1').onclick=()=>run(async()=>{
    const pool=scope(rl.w).filter(x=>x.status==='À voir'&&types().includes(x.type)&&(!rl.g||x.genres.includes(rl.g)));
    if(!pool.length){$('#reel').textContent='?';$('#rsub').textContent='Aucun titre « à voir »'+(rl.g?' dans ce genre':'')+'. Ajoutez-en depuis l’onglet Recherche.';return}
    const x=pick(pool);await sp(pool.map(p=>p.title),x.title);result(x,x)});
  $('#r3').onclick=()=>run(async()=>{
    const t=pick(types()),path='/discover/'+(t==='film'?'movie':'tv'),g=rl.g&&GEN?GEN.find(x=>x.name===rl.g):null;
    const pr={sort_by:'popularity.desc','vote_count.gte':300,page:1+Math.floor(Math.random()*15)};
    if(g&&gid(g,t))pr.with_genres=gid(g,t);
    let r=await tm(path,pr);if(!r.results.length)r=await tm(path,{...pr,page:1});
    const pool=r.results.filter(x=>x.poster_path&&!db.some(i=>i.tmdb_id===x.id&&i.type===t));
    if(!pool.length){$('#rsub').textContent='Rien de nouveau trouvé cette fois, relancez.';return}
    const p=pick(pool),title=p.title||p.name;await sp(pool.map(x=>x.title||x.name),title);
    const o=await details(p.id,t);result(o,db.find(i=>i.tmdb_id===o.tmdb_id&&i.type===o.type))});
}

/* ---------- Historique & classement ---------- */
const row=(x,lead,val,ex='')=>`<div class="rw" data-id="${x.id}" tabindex="0" role="button"><div class="n">${lead}</div><div>${poster(x)}</div><div class="rb"><b>${esc(x.title)}</b><div class="meta">${x.type==='film'?'Film':'Série'}${[x.year,len(x)].filter(Boolean).map(v=>' · '+esc(v)).join('')}</div></div><div class="v">${val}${ex}</div></div>`;
const bindRows=()=>{document.querySelectorAll('[data-e]').forEach(b=>b.onclick=e=>{e.stopPropagation();editHist(b.dataset.e)});
  document.querySelectorAll('.rw').forEach(c=>{const o=()=>{const x=db.find(y=>y.id===c.dataset.id);fiche(x,x)};c.onclick=o;c.onkeydown=e=>{if(e.key==='Enter')o()}})};
const dfr=(d,o)=>new Date(d+'T12:00').toLocaleDateString('fr-FR',o);
const EDIT=x=>`<button type="button" class="ibtn sm" data-e="${x.id}" aria-label="Modifier">${ic('edit')}</button>`;
const whoSel=(id,v)=>`<select id="${id}" aria-label="Qui">${[['nous','Nous deux'],['lu','Lu'],['gab','Gab']].map(([k,n])=>`<option value="${k}"${k===v?' selected':''}>${n}</option>`).join('')}</select>`;
let hw='nous';
function histPage(a){
  const r=scope(hw).filter(x=>x.status==='Déjà regardé').sort((x,y)=>(y.watched_at||'').localeCompare(x.watched_at||'')),g={};
  r.forEach(x=>{const k=x.watched_at?dfr(x.watched_at,{month:'long',year:'numeric'}):'Sans date';(g[k]=g[k]||[]).push(x)});
  a.innerHTML=`<div class="ph"><h1>Historique</h1><p>${r.length} titre${r.length>1?'s':''} vu${r.length>1?'s':''} ${hw==='nous'?'ensemble':'par '+PERS[hw]}</p></div><div class="tools t1">${whoSel('hw',hw)}</div><div class="sbar"><button class="btn ghost" id="ha">+ Ajouter un visionnage</button></div><div class="rl">`+
    (r.length?Object.entries(g).map(([k,l])=>`<h3 class="mh">${k}</h3>`+l.map(x=>row(x,x.watched_at?dfr(x.watched_at,{day:'numeric',month:'short'}):'–',sc(x,hw)==null?'':fmt(sc(x,hw)),EDIT(x))).join('')).join(''):'<div class="empty">Rien ici pour l’instant. Passez un titre en « Déjà regardé » pour le retrouver ici.</div>')+'</div>';
  $('#hw').onchange=e=>{hw=e.target.value;histPage(a)};$('#ha').onclick=addHist;bindRows();
}
const histRows=(id,u)=>(hw==='nous'?['Lu','Gab']:[PERS[hw]]).map(n=>({item_id:id,user_id:PID[n],...u}));
async function histSave(rows){const{error}=await sb.from('statuses').upsert(rows,{onConflict:'item_id,user_id'});if(error)return toast('Échec : '+error.message);$('#dlg').close();await load();refresh();toast('Historique mis à jour')}
function histDlg(title,body,ok,extra=''){
  const d=$('#dlg');d.innerHTML=`<div class="fi"><button class="x" id="cl" aria-label="Fermer">×</button><h2>${title}</h2>${body}<div class="acts" style="gap:10px;flex-wrap:wrap">${extra}<button class="btn ghost" id="hc">Annuler</button><button class="btn" id="hs">Enregistrer</button></div></div>`;
  $('#cl').onclick=$('#hc').onclick=()=>d.close();d.onclick=e=>{if(e.target===d)d.close()};$('#hs').onclick=ok;if(!d.open)d.showModal();
}
function editHist(id){
  const x=db.find(i=>i.id===id),v=scope(hw).find(i=>i.id===id)||x;
  histDlg(esc(x.title),`<div class="box"><div class="row"><label for="hd">Vu le</label><input type="date" id="hd" value="${v.watched_at||''}"></div></div>`,
    ()=>histSave(histRows(id,{status:'Déjà regardé',watched_at:$('#hd').value||null})),'<button class="btn del" id="hr">Retirer de l’historique</button>');
  $('#hr').onclick=()=>histSave(histRows(id,{status:'À voir',watched_at:null}));
}
function addHist(){
  const seen=new Set(scope(hw).filter(x=>x.status==='Déjà regardé').map(x=>x.id)),l=db.filter(x=>!seen.has(x.id)).sort((a,b)=>a.title.localeCompare(b.title,'fr'));
  if(!l.length)return toast('Tous les titres de la bibliothèque sont déjà dans l’historique');
  histDlg('Ajouter un visionnage',`<div class="box"><div class="row"><label for="ht">Titre</label><select id="ht">${l.map(x=>`<option value="${x.id}">${esc(x.title)}${x.year?' ('+x.year+')':''}</option>`).join('')}</select></div><div class="row"><label for="hd">Vu le</label><input type="date" id="hd" value="${today()}"></div></div>`,
    ()=>histSave(histRows($('#ht').value,{status:'Déjà regardé',watched_at:$('#hd').value||null})));
}
let rk={w:'nous',s:'note',o:'desc',t:''};
const SORTS={note:['Note',x=>sc(x,rk.w),v=>fmt(v)+'/10'],
  len:['Durée (films)',x=>x.type==='film'?x.length:null,v=>Math.floor(v/60)+'h'+String(v%60).padStart(2,'0')],
  year:['Année de sortie',x=>x.year,v=>v],add:['Date d’ajout',x=>x.created_at,v=>new Date(v).toLocaleDateString('fr-FR')],title:['Titre (A–Z)',x=>x.title,()=>'']};
function rankPage(a){
  const[,key,show]=SORTS[rk.s],base=rk.w==='nous'?db:scope(rk.w);
  const all=base.filter(x=>!rk.t||x.type===rk.t).map(x=>({x,v:key(x)})),it=all.filter(e=>e.v!=null);
  it.sort((p,q)=>{const c=typeof p.v==='string'?p.v.localeCompare(q.v,'fr'):p.v-q.v;return rk.o==='asc'?c:-c});
  a.innerHTML=`<div class="ph"><h1>Classement</h1><p>${it.length} titre${it.length>1?'s':''} classé${it.length>1?'s':''}${all.length>it.length?` · ${all.length-it.length} sans valeur pour ce critère`:''}</p></div>
  <div class="tools t4">${whoSel('kw',rk.w)}<select id="ks" aria-label="Trier par">${Object.entries(SORTS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select>
  <select id="ko" aria-label="Ordre"><option value="desc">Décroissant</option><option value="asc">Croissant</option></select>
  <select id="kt" aria-label="Type"><option value="">Films et séries</option><option value="film">Films</option><option value="serie">Séries</option></select></div>
  <div class="rl">${it.length?it.map((e,i)=>row(e.x,i+1,show(e.v))).join(''):'<div class="empty">Rien à classer pour l’instant.</div>'}</div>`;
  $('#ks').value=rk.s;$('#ko').value=rk.o;$('#kt').value=rk.t;
  $('#kw').onchange=e=>{rk.w=e.target.value;rankPage(a)};
  $('#ks').onchange=e=>{rk.s=e.target.value;rk.o=rk.s==='title'?'asc':'desc';rankPage(a)};
  $('#ko').onchange=e=>{rk.o=e.target.value;rankPage(a)};$('#kt').onchange=e=>{rk.t=e.target.value;rankPage(a)};
  bindRows();
}

function login(){
  $('#app').innerHTML=`<div class="ph"><h1>Connexion</h1></div><form class="lf" id="lf"><label>E-mail<input name="email" type="email" required autocomplete="username"></label><label>Mot de passe<input name="password" type="password" required autocomplete="current-password"></label><button class="btn">Se connecter</button></form>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target);
    const{error}=await sb.auth.signInWithPassword({email:d.get('email'),password:d.get('password')});
    if(error)return toast('Connexion refusée : e-mail ou mot de passe incorrect');location.reload()};
}
const SEG=(k,o)=>`<div class="seg" data-k="${k}">${o.map(([v,l,c])=>`<button type="button" data-v="${v}" class="${String(prefs[k])===String(v)?'on':''}"${c?` style="background:${c};width:30px;height:30px;padding:0;border-radius:50%;${String(prefs[k])===v?'outline:2px solid var(--tx);outline-offset:2px':''}" aria-label="${l}"`:''}>${c?'':l}</button>`).join('')}</div>`;
const SEL=(k,o)=>`<select data-k="${k}" aria-label="${k}">${o.map(([v,l])=>`<option value="${v}"${String(prefs[k])===v?' selected':''}>${l}</option>`).join('')}</select>`;
const SR=(t,d,c)=>`<div class="srow"><div><b>${t}</b><small>${d}</small></div>${c}</div>`;
const YN=k=>SEG(k,[[true,'Oui'],[false,'Non']]);
function settings(a){
  a.innerHTML=`<div class="ph"><h1>Réglages</h1><p>Connecté en tant que <b>${esc(me)}</b> (${esc(user.email)}). Vos préférences sont gardées dans ce navigateur.</p></div><div class="sg">
  <h3 class="mh">Apparence</h3><div class="sc2">
  ${SR('Thème','Ambiance générale du site',SEG('theme',[['prune','Prune'],['minuit','Minuit'],['clair','Clair']]))}
  ${SR('Couleur d’accent','Boutons, sélections et surbrillances',SEG('accent',[['#f58fa3','Rose','#f58fa3'],['#6fd6b0','Menthe','#6fd6b0'],['#7cb7ff','Ciel','#7cb7ff'],['#b79bff','Violet','#b79bff'],['#f2b45a','Ambre','#f2b45a']]))}
  ${SR('Taille du texte','Plus confortable à lire',SEG('size',[['100%','Normal'],['112%','Grand'],['125%','Très grand']]))}
  ${SR('Densité','Espacement des listes',SEG('dense',[[false,'Aérée'],[true,'Compacte']]))}
  ${SR('Descriptions','Aperçu du résumé dans les listes',YN('desc'))}</div>
  <h3 class="mh">Utilisation</h3><div class="sc2">
  ${SR('Page de démarrage','Onglet ouvert à l’arrivée sur le site',SEL('home',[['nous','Nous'],['lu','Lu'],['gab','Gab'],['recherche','Recherche'],['roulette','Roulette']]))}
  ${SR('Tri par défaut','Ordre initial des listes',SEL('sort',Object.entries(S).map(([k,v])=>[k,v[0]])))}
  ${SR('Animation de la roulette','Faire défiler les titres avant le résultat',YN('anim'))}
  ${SR('Pays des plateformes','Où chercher le streaming, pour les prochains ajouts',SEL('country',[['FR','France'],['BE','Belgique'],['CH','Suisse'],['CA','Canada'],['LU','Luxembourg']]))}</div>
  <h3 class="mh">Données et compte</h3><div class="sc2">
  ${SR('Exporter','Télécharger toute la bibliothèque en JSON','<button class="btn ghost" id="ex">Exporter</button>')}
  ${SR('Préférences','Revenir aux réglages d’origine','<button class="btn ghost" id="rs">Réinitialiser</button>')}
  ${SR('Session','Se déconnecter de ce navigateur','<button class="btn del" id="lo">Se déconnecter</button>')}</div></div>`;
  a.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const v=b.dataset.v;setPref(b.parentNode.dataset.k,v==='true'?true:v==='false'?false:v);settings(a)});
  a.querySelectorAll('select[data-k]').forEach(x=>x.onchange=()=>setPref(x.dataset.k,x.value));
  $('#ex').onclick=()=>{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify({items:db,statuses:sts,ratings:rat},null,1)],{type:'application/json'}));l.download='cinetheque.json';l.click()};
  $('#rs').onclick=()=>{localStorage.removeItem('cine');location.reload()};
  $('#lo').onclick=async()=>{await sb.auth.signOut();location.reload()};
}
new MutationObserver(()=>{const p=document.querySelector('#app .ph');if(p&&!p.querySelector('#rf'))p.insertAdjacentHTML('afterbegin',`<button class="ibtn left" id="rf" aria-label="Recharger la page" title="Recharger">${ic('refresh')}</button>`)}).observe($('#app'),{childList:true});
document.addEventListener('click',e=>{if(e.target.closest('#rf'))location.reload()});
addEventListener('hashchange',go);
boot();
</script>
