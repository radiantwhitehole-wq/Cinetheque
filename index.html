<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nos écrans à deux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1625;--bg2:#271d31;--line:#3b2f48;--tx:#f4ecf6;--mu:#a999b3;--ac:#f58fa3;--ac2:#ffc98b;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,.logo{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
header{position:sticky;top:0;z-index:5;background:rgba(29,22,37,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:auto;padding:0 20px;display:flex;align-items:center;gap:28px;overflow-x:auto}
.logo{font-weight:800;font-size:1.25rem;padding:16px 0;white-space:nowrap}
nav{display:flex;gap:4px}
nav a{color:var(--mu);text-decoration:none;padding:18px 12px 15px;border-bottom:3px solid transparent;font-weight:500;white-space:nowrap}
nav a:hover{color:var(--tx)}
nav a.on{color:var(--tx);border-color:var(--ac)}
main{max-width:1180px;margin:auto;padding:32px 20px 80px}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:2.6rem;margin:0;line-height:1.05}
.count{color:var(--mu);margin:4px 0 0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
input,select,textarea,button{font:inherit;color:inherit}
.tools input,.tools select,.f input,.f select,.f textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:100%}
.tools input{flex:1 1 260px;width:auto}
.tools select{width:auto;flex:0 0 auto}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.btn{background:var(--ac);color:#2a1220;border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.del{background:transparent;color:#ff8a8a;border:1px solid #6b3a44;margin-right:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.card:hover{border-color:var(--ac)}
.poster{aspect-ratio:2/3;width:100%;object-fit:cover;display:grid;place-items:center;font:800 4rem 'Bricolage Grotesque';color:rgba(255,255,255,.85)}
.info{padding:12px 14px 14px}
.info h3{margin:0;font-size:1rem;line-height:1.25}
.meta{color:var(--mu);font-size:.85rem;margin:2px 0 8px}
.tag{display:inline-block;font-size:.78rem;padding:2px 10px;border-radius:99px;border:1px solid currentColor;font-weight:500}
.rate{float:right;font-weight:700;color:var(--ac2);font-size:.9rem}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:var(--r);padding:48px 20px;text-align:center;color:var(--mu)}
dialog{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:18px;padding:0;width:min(640px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(10,6,14,.7)}
.f{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f h2{grid-column:1/-1;margin:0;font-size:1.6rem}
.f label{display:grid;gap:4px;font-size:.88rem;color:var(--mu)}
.f .w{grid-column:1/-1}
.f textarea{min-height:90px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:none;border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.8rem;color:var(--mu);cursor:pointer}
.chips button:hover{color:var(--tx);border-color:var(--ac)}
.acts{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end}
.soon,.set{max-width:560px;color:var(--mu)}
.set .f{padding:0;grid-template-columns:1fr}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media(max-width:520px){.f{grid-template-columns:1fr}h1{font-size:2rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar"><div class="logo">Nos écrans à deux</div>
<nav><a href="#films">Films</a><a href="#series">Séries</a><a href="#roulette">Roulette</a><a href="#historique">Historique</a><a href="#parametres">Paramètres</a></nav></div></header>
<main id="app"></main>
<dialog id="dlg"><form class="f" id="form" method="dialog"></form></dialog>
<div class="toast" id="toast"></div>
<script>
const STATUS={'À voir':'#8ec5ff','Déjà regardé':'#8fe0b0','En cours':'#ffc98b','En pause':'#c4b0ff','Abandonné':'#ff9a9a'};
const T={films:{t:'film',one:'film',many:'Films',len:'Durée (min)',cr:'Réalisateur'},series:{t:'serie',one:'série',many:'Séries',len:'Saisons',cr:'Créateur'}};
let db=[],sha=null,route='films',f={q:'',st:'',g:''};
let cfg={};try{cfg=JSON.parse(localStorage.cfg||'{}')}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s)));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2800)};
const api=()=>`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data/library.json`;
const hdr=()=>({Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'});

async function load(){
  try{
    if(cfg.token){
      const r=await fetch(api()+'?ref='+(cfg.branch||'main'),{headers:hdr()});
      if(!r.ok)throw 0;const j=await r.json();sha=j.sha;db=JSON.parse(dec(j.content));
    }else{
      const r=await fetch('data/library.json?'+Date.now());db=await r.json();
      if(localStorage.db)db=JSON.parse(localStorage.db);
    }
  }catch(e){db=JSON.parse(localStorage.db||'[]');toast('Chargement impossible : données locales affichées')}
}
async function save(){
  localStorage.db=JSON.stringify(db);
  if(!cfg.token)return toast('Enregistré sur cet appareil. Ajoute un jeton dans Paramètres pour partager.');
  try{
    const r=await fetch(api(),{method:'PUT',headers:hdr(),body:JSON.stringify({message:'Mise à jour de la liste',content:enc(JSON.stringify(db,null,1)),sha,branch:cfg.branch||'main'})});
    if(!r.ok)throw r.status;sha=(await r.json()).content.sha;toast('Enregistré sur GitHub');
  }catch(e){toast(e==409||e==422?'Conflit : recharge la page, puis réessaie':'Échec de l’enregistrement GitHub ('+e+')')}
}

function go(){
  route=(location.hash||'#films').slice(1);
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.hash==='#'+route));
  f={q:'',st:'',g:''};
  const a=$('#app');
  if(T[route])return list(a);
  if(route==='parametres')return settings(a);
  const name=route==='roulette'?'Roulette de visionnage':'Historique';
  a.innerHTML=`<h1>${name}</h1><p class="soon">Cette page arrive bientôt.</p>`;
}
function list(a){
  const c=T[route],genres=[...new Set(db.filter(x=>x.type===c.t).flatMap(x=>x.genres))].sort((x,y)=>x.localeCompare(y,'fr'));
  a.innerHTML=`<div class="head"><div><h1>${c.many}</h1><p class="count" id="cnt"></p></div><button class="btn" id="add">Ajouter ${c.t==='film'?'un film':'une série'}</button></div>
  <div class="tools"><input id="q" type="search" placeholder="Rechercher un titre" aria-label="Rechercher un titre">
  <select id="st" aria-label="Statut"><option value="">Tous les statuts</option>${Object.keys(STATUS).map(s=>`<option>${s}</option>`).join('')}</select>
  <select id="g" aria-label="Genre"><option value="">Tous les genres</option>${genres.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div>
  <div class="grid" id="grid"></div>`;
  $('#q').oninput=e=>{f.q=e.target.value;cards()};$('#st').onchange=e=>{f.st=e.target.value;cards()};$('#g').onchange=e=>{f.g=e.target.value;cards()};
  $('#add').onclick=()=>edit();cards();
}
function cards(){
  const c=T[route],all=db.filter(x=>x.type===c.t),q=f.q.trim().toLowerCase();
  const r=all.filter(x=>(!q||x.title.toLowerCase().includes(q))&&(!f.st||x.status===f.st)&&(!f.g||x.genres.includes(f.g))).sort((a,b)=>b.addedAt-a.addedAt);
  $('#cnt').textContent=`${r.length} ${r.length>1?c.many.toLowerCase():c.one} sur ${all.length}`;
  $('#grid').innerHTML=r.length?r.map(x=>{
    const h=[...x.title].reduce((s,ch)=>s+ch.charCodeAt(0),0)*37%360;
    const p=x.poster?`<img class="poster" src="${esc(x.poster)}" alt="" loading="lazy">`:`<div class="poster" style="background:linear-gradient(160deg,hsl(${h} 45% 38%),hsl(${(h+50)%360} 45% 22%))">${esc(x.title[0]||'?')}</div>`;
    return `<button class="card" data-id="${x.id}">${p}<div class="info"><h3>${esc(x.title)}</h3><div class="meta">${[x.year,x.genres.slice(0,2).join(', ')].filter(Boolean).map(esc).join(' · ')}</div>
    <span class="tag" style="color:${STATUS[x.status]}">${x.status}</span>${x.rating!=null?`<span class="rate">${x.rating}/10</span>`:''}</div></button>`}).join('')
    :`<div class="empty">${all.length?'Aucun résultat avec ces filtres.':`Rien ici pour l’instant. Ajoutez ${c.t==='film'?'votre premier film':'votre première série'}.`}</div>`;
  document.querySelectorAll('.card').forEach(b=>b.onclick=()=>edit(b.dataset.id));
}
function edit(id){
  const c=T[route],x=db.find(y=>y.id===id)||{status:'À voir',genres:[]};
  const all=[...new Set(db.flatMap(y=>y.genres))].sort((a,b)=>a.localeCompare(b,'fr'));
  const v=k=>esc(x[k]??'');
  $('#form').innerHTML=`<h2>${id?'Modifier':'Ajouter'} ${c.t==='film'?'un film':'une série'}</h2>
  <label class="w">Titre<input name="title" required value="${v('title')}"></label>
  <label>Année<input name="year" type="number" min="1888" max="2100" value="${v('year')}"></label>
  <label>${c.len}<input name="length" type="number" min="0" value="${v('length')}"></label>
  <label>${c.cr}<input name="creator" value="${v('creator')}"></label>
  <label>Plateforme<input name="platform" value="${v('platform')}" placeholder="Netflix, cinéma…"></label>
  <label>Statut<select name="status">${Object.keys(STATUS).map(s=>`<option${s===x.status?' selected':''}>${s}</option>`).join('')}</select></label>
  <label>Note (0 à 10)<input name="rating" type="number" min="0" max="10" step="0.5" value="${v('rating')}"></label>
  <label class="w">Genres (séparés par des virgules)<input name="genres" id="gin" value="${esc(x.genres.join(', '))}" placeholder="Comédie, Thriller">
  ${all.length?`<span class="chips">${all.map(g=>`<button type="button" data-g="${esc(g)}">${esc(g)}</button>`).join('')}</span>`:''}</label>
  <label class="w">Lien de l’affiche (optionnel)<input name="poster" type="url" value="${v('poster')}" placeholder="https://…"></label>
  <label class="w">Description<textarea name="description">${v('description')}</textarea></label>
  <div class="acts">${id?'<button type="button" class="btn del" id="del">Supprimer</button>':''}<button type="button" class="btn ghost" id="cx">Annuler</button><button class="btn">Enregistrer</button></div>`;
  document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{
    const i=$('#gin'),l=i.value.split(',').map(s=>s.trim()).filter(Boolean);
    if(!l.includes(b.dataset.g))l.push(b.dataset.g);i.value=l.join(', ')});
  $('#cx').onclick=()=>$('#dlg').close();
  if(id)$('#del').onclick=()=>{if(confirm('Supprimer « '+x.title+' » ?')){db=db.filter(y=>y.id!==id);$('#dlg').close();save();list($('#app'))}};
  $('#form').onsubmit=e=>{
    const d=new FormData(e.target),n=k=>d.get(k).trim();
    const o={...x,id:id||'i'+Date.now().toString(36),type:c.t,title:n('title'),year:+n('year')||null,length:+n('length')||null,creator:n('creator'),platform:n('platform'),status:d.get('status'),
      rating:n('rating')===''?null:+n('rating'),genres:[...new Set(n('genres').split(',').map(s=>s.trim()).filter(Boolean))],poster:n('poster'),description:n('description'),addedAt:x.addedAt||Date.now()};
    db=id?db.map(y=>y.id===id?o:y):[...db,o];save();list($('#app'));
  };
  $('#dlg').showModal();
}
function settings(a){
  a.innerHTML=`<h1>Paramètres</h1><div class="set"><p>Pour que vous deux partagiez la même liste, renseignez le dépôt GitHub et un jeton d’accès. Ils restent uniquement dans ce navigateur.</p>
  <form class="f" id="cf"><label>Compte ou organisation GitHub<input name="owner" value="${esc(cfg.owner)}"></label><label>Nom du dépôt<input name="repo" value="${esc(cfg.repo)}"></label>
  <label>Branche<input name="branch" value="${esc(cfg.branch||'main')}"></label><label>Jeton d’accès (fine-grained, droit « Contents : Read and write »)<input name="token" type="password" value="${esc(cfg.token)}"></label>
  <div class="acts" style="justify-content:flex-start"><button class="btn">Enregistrer</button><button type="button" class="btn ghost" id="ex">Exporter en JSON</button></div></form></div>`;
  $('#cf').onsubmit=async e=>{e.preventDefault();cfg=Object.fromEntries(new FormData(e.target));localStorage.cfg=JSON.stringify(cfg);await load();toast('Paramètres enregistrés')};
  $('#ex').onclick=()=>{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));l.download='library.json';l.click()};
}
addEventListener('hashchange',go);
load().then(go);
</script>
</body>
</html>
